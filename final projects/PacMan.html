<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b18;
      color: #eef4ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #14224a 0, transparent 55%),
        #070b18;
    }
    main { width: min(100%, 760px); text-align: center; }
    h1 {
      margin: 0 0 6px;
      color: #ffdf35;
      font-size: clamp(2rem, 7vw, 3.4rem);
      letter-spacing: .12em;
      text-shadow: 0 0 24px #ffcb3566;
    }
    .subtitle { margin: 0 0 20px; color: #aab8d5; }
    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 auto 12px;
      padding: 12px 16px;
      border: 1px solid #26365f;
      border-radius: 12px;
      background: #111a31;
      font-weight: 700;
    }
    .hud span { color: #ffdf35; }
    .board {
      width: 100%;
      overflow: hidden;
      padding: 10px;
      border: 2px solid #2548c9;
      border-radius: 14px;
      background: #050817;
      box-shadow: 0 0 32px #1645ff30;
    }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin: 16px 0 10px;
    }
    button {
      min-width: 46px;
      min-height: 42px;
      border: 1px solid #40578c;
      border-radius: 9px;
      background: #172342;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover, button:focus-visible { background: #253967; outline: 2px solid #ffdf35; }
    button.action { padding: 0 16px; }
    .help { margin: 8px 0 0; color: #aab8d5; font-size: .92rem; }
    #message { min-height: 1.5em; margin: 10px 0 0; color: #ffdf35; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>PAC-MAN</h1>
    <p class="subtitle">Clear the maze. Watch out for the ghosts!</p>
    <section class="hud" aria-label="Game status">
      <div>Score <span id="score">0</span></div>
      <div>Lives <span id="lives">3</span></div>
      <div>Level <span id="level">1</span>/2</div>
      <div id="powerStatus">Ready</div>
    </section>
    <div class="board">
      <canvas id="game" aria-label="Pac-Man maze game"></canvas>
    </div>
    <div class="controls" aria-label="Game controls">
      <button data-dir="up" aria-label="Move up">↑</button>
      <button data-dir="left" aria-label="Move left">←</button>
      <button data-dir="down" aria-label="Move down">↓</button>
      <button data-dir="right" aria-label="Move right">→</button>
      <button class="action" id="restart">Restart</button>
    </div>
    <p class="help">Use arrow keys or WASD to move. Press R to restart.</p>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    "use strict";

    const levels = [
      [
        "##########.##########",
        "#...................#",
        "#.###.###.#.###.###.#",
        "#o###.###.#.###.###o#",
        "#...................#",
        "#.###.#.#####.#.###.#",
        "#.....#...#...#.....#",
        "#####.###.#.###.#####",
        "#...#.#.......#.#...#",
        "#.#.#.#.## ##.#.#.#.#",
        "..#.....#   #.....#..",
        "#.#.#.#.#####.#.#.#.#",
        "#...#.#.......#.#...#",
        "#####.#.#####.#.#####",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#o..#.....P.....#..o#",
        "###.#.#.#####.#.#.###",
        "#.....#...#...#.....#",
        "#.#######.#.#######.#",
        "#...................#",
        "##########.##########"
      ],
      [
        "##########.##########",
        "#...................#",
        "#.###.#...#...#.###.#",
        "#o..#.#.#.#.#.#.#..o#",
        "#...#...........#...#",
        "#.#.#.###.###.#.#.#.#",
        "#...#.....#.....#...#",
        "###.###.#.#.###.###.#",
        "#...#...#...#...#...#",
        "#.#.#.#.## ##.#.#.#.#",
        "..#.....#   #.....#..",
        "#.#.#.#.#####.#.#.#.#",
        "#...#.#.......#.#...#",
        "#.###.#.#####.#.###.#",
        "#.........#.........#",
        "#.###.###.#.###.###.#",
        "#o..#.....P.....#..o#",
        "###.#.#.#####.#.#.###",
        "#.....#...#...#.....#",
        "#.#######.#.#######.#",
        "#...................#",
        "##########.##########"
      ]
    ];
    const tile = 30;
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");
    const levelElement = document.getElementById("level");
    const powerElement = document.getElementById("powerStatus");
    const messageElement = document.getElementById("message");
    const directions = {
      ArrowUp: [0, -1], w: [0, -1],
      ArrowDown: [0, 1], s: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0]
    };
    const ghostColors = ["#ff526c", "#ff8be7", "#53e9ff", "#ffad43"];
    let grid;
    let player;
    let playerStart;
    let ghosts;
    let score;
    let lives;
    let levelIndex;
    let powerTicks;
    let tick;
    let gameState;

    function resetLevel(index) {
      levelIndex = index;
      grid = levels[index].map(row => row.split(""));
      const start = grid.flatMap((row, y) => row.map((cell, x) =>
        cell === "P" ? { x, y } : null)).find(position => position !== null);
      player = start || { x: 10, y: 16 };
      playerStart = { x: player.x, y: player.y };
      grid[player.y][player.x] = " ";
      ghosts = [
        { x: 9, y: 10, homeX: 9, homeY: 10 },
        { x: 10, y: 10, homeX: 10, homeY: 10 },
        { x: 11, y: 10, homeX: 11, homeY: 10 },
        { x: 10, y: 9, homeX: 10, homeY: 9 }
      ];
      powerTicks = 0;
      tick = 0;
      gameState = "playing";
      messageElement.textContent = "";
      updateHud();
      draw();
    }

    function restart() {
      score = 0;
      lives = 3;
      resetLevel(0);
    }

    function canMove(x, y) {
      return y >= 0 && y < grid.length
        && x >= 0 && x < grid[y].length
        && grid[y][x] !== "#";
    }

    function updateHud() {
      scoreElement.textContent = score;
      livesElement.textContent = lives;
      levelElement.textContent = levelIndex + 1;
      powerElement.textContent = powerTicks > 0 ? "Power on!" : "Ready";
    }

    function eatCell() {
      const cell = grid[player.y][player.x];
      if (cell === ".") {
        score += 10;
        grid[player.y][player.x] = " ";
      } else if (cell === "o") {
        score += 50;
        powerTicks = 50;
        grid[player.y][player.x] = " ";
      }
    }

    function moveGhosts() {
      for (const ghost of ghosts) {
        const options = [[0, -1], [0, 1], [-1, 0], [1, 0]]
          .filter(([dx, dy]) => canMove(ghost.x + dx, ghost.y + dy));
        if (!options.length) continue;

        let move;
        if (powerTicks === 0 && Math.random() < 0.65) {
          options.sort((a, b) => {
            const distanceA = Math.abs(ghost.x + a[0] - player.x)
              + Math.abs(ghost.y + a[1] - player.y);
            const distanceB = Math.abs(ghost.x + b[0] - player.x)
              + Math.abs(ghost.y + b[1] - player.y);
            return distanceA - distanceB;
          });
          move = options[0];
        } else {
          move = options[Math.floor(Math.random() * options.length)];
        }
        ghost.x += move[0];
        ghost.y += move[1];

        if (ghost.x === player.x && ghost.y === player.y) {
          if (powerTicks > 0) {
            score += 200;
            ghost.x = ghost.homeX;
            ghost.y = ghost.homeY;
          } else {
            lives -= 1;
            if (lives <= 0) {
              gameState = "over";
              messageElement.textContent = "Game over! Press R or Restart to play again.";
              return;
            }
            player = { x: playerStart.x, y: playerStart.y };
            powerTicks = 0;
            messageElement.textContent = "Caught! Keep going.";
            break;
          }
        }
      }
    }

    function hasDots() {
      return grid.some(row => row.some(cell => cell === "." || cell === "o"));
    }

    function advance() {
      if (!hasDots()) {
        if (levelIndex + 1 < levels.length) {
          resetLevel(levelIndex + 1);
        } else {
          gameState = "won";
          messageElement.textContent = "You cleared both mazes! Press R to play again.";
        }
      }
    }

    function takeTurn(dx, dy) {
      if (gameState !== "playing") return;
      const nextX = player.x + dx;
      const nextY = player.y + dy;
      if (!canMove(nextX, nextY)) return;
      player.x = nextX;
      player.y = nextY;
      eatCell();
      if (tick % 2 === 0) moveGhosts();
      if (powerTicks > 0) powerTicks -= 1;
      tick += 1;
      if (gameState === "playing") advance();
      updateHud();
      draw();
    }

    function draw() {
      canvas.width = grid[0].length * tile;
      canvas.height = grid.length * tile;
      context.fillStyle = "#050817";
      context.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < grid.length; y++) {
        for (let x = 0; x < grid[y].length; x++) {
          const cell = grid[y][x];
          const centerX = x * tile + tile / 2;
          const centerY = y * tile + tile / 2;
          if (cell === "#") {
            context.fillStyle = "#1740bb";
            context.fillRect(x * tile + 2, y * tile + 2, tile - 4, tile - 4);
            context.strokeStyle = "#3971ff";
            context.lineWidth = 2;
            context.strokeRect(x * tile + 3, y * tile + 3, tile - 6, tile - 6);
          } else if (cell === ".") {
            context.fillStyle = "#f3e7ad";
            context.beginPath();
            context.arc(centerX, centerY, 3, 0, Math.PI * 2);
            context.fill();
          } else if (cell === "o") {
            context.fillStyle = "#fff4a8";
            context.beginPath();
            context.arc(centerX, centerY, 7, 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      context.fillStyle = "#ffdf35";
      context.beginPath();
      context.arc(player.x * tile + tile / 2, player.y * tile + tile / 2,
        tile * 0.39, 0.2, Math.PI * 1.8);
      context.lineTo(player.x * tile + tile / 2, player.y * tile + tile / 2);
      context.fill();

      ghosts.forEach((ghost, index) => {
        const x = ghost.x * tile;
        const y = ghost.y * tile;
        context.fillStyle = powerTicks > 0 ? "#436dff" : ghostColors[index];
        context.beginPath();
        context.arc(x + tile / 2, y + tile / 2, tile * 0.37, Math.PI, 0);
        context.lineTo(x + tile * 0.87, y + tile * 0.88);
        context.lineTo(x + tile * 0.68, y + tile * 0.76);
        context.lineTo(x + tile * 0.5, y + tile * 0.88);
        context.lineTo(x + tile * 0.31, y + tile * 0.76);
        context.lineTo(x + tile * 0.13, y + tile * 0.88);
        context.closePath();
        context.fill();
        context.fillStyle = "#fff";
        context.beginPath();
        context.arc(x + tile * 0.39, y + tile * 0.43, 3.5, 0, Math.PI * 2);
        context.arc(x + tile * 0.63, y + tile * 0.43, 3.5, 0, Math.PI * 2);
        context.fill();
      });
    }

    window.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "r") {
        restart();
        return;
      }
      const direction = directions[event.key] || directions[event.key.toLowerCase()];
      if (direction) {
        event.preventDefault();
        takeTurn(direction[0], direction[1]);
      }
    });
    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("click", () => {
        const direction = {
          up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
        }[button.dataset.dir];
        takeTurn(direction[0], direction[1]);
      });
    });
    document.getElementById("restart").addEventListener("click", restart);

    restart();
  </script>
</body>
</html>
