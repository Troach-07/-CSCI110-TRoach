name: Deploy Game Center

on:
  push:
    branches: [main]
    paths:
      - "personal projects/game_center.html"
      - "fields/**"
      - ".github/workflows/deploy-game-center.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare game site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "site/personal projects" site/fields
          cp "personal projects/game_center.html" "site/personal projects/index.html"
          cp fields/field_*.svg site/fields/
          python3 - <<'PY'
          from pathlib import Path
          import re

          finder_index = int(Path("fields/finder_position.txt").read_text(encoding="utf-8").strip())
          if not 0 <= finder_index < 21:
              raise ValueError("finder index must be between 0 and 20")
          page = Path("site/personal projects/index.html")
          html = page.read_text(encoding="utf-8")
          html, replacements = re.subn(
              r'<html lang="en" data-finder-index="\d+">',
              f'<html lang="en" data-finder-index="{finder_index}">',
              html,
              count=1,
          )
          if replacements != 1:
              raise ValueError("could not set the hosted Field Finder target")
          page.write_text(html, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
