<!doctype html>
<html lang="en" data-finder-index="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Center</title>
  <style>
    :root { color-scheme: dark; --felt: #12392e; --felt-light: #1b4c3c; --gold: #dfc277; --paper: #f5f0e4; --muted: #c7c1ae; --red: #bd2637; --black: #181a19; --line: #dfc27755; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--paper); background: radial-gradient(ellipse at 24% 12%, #285947 0, var(--felt) 54%, #0c261f 100%); font-family: Georgia, 'Times New Roman', serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; max-width: 1440px; margin: auto; padding: 17px 28px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand strong { color: var(--gold); font-size: 25px; font-weight: 500; }
    .brand span, .wallet label { color: var(--muted); font: 11px system-ui, sans-serif; letter-spacing: 1.4px; text-transform: uppercase; }
    .wallet { display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 10px; text-align: right; font: 14px system-ui, sans-serif; }
    .wallet label, .wallet strong { grid-column: 1; }
    #save-terminal { grid-column: 2; grid-row: 1 / 3; min-height: 38px; padding: 6px 10px; border: 1px solid var(--gold); border-radius: 4px; background: #183b2f; color: var(--gold); font: 12px system-ui, sans-serif; }
    #save-status { grid-column: 1 / -1; min-height: 16px; color: var(--muted); font: 11px system-ui, sans-serif; }
    .wallet strong { color: white; font-size: 20px; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 25px; max-width: 1440px; margin: auto; padding: 24px 28px 40px; }
    aside { align-self: start; display: grid; gap: 5px; position: sticky; top: 16px; }
    .nav-label { margin: 15px 0 4px; color: var(--muted); font: 10px system-ui, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .nav-button { min-height: 39px; padding: 8px 11px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--paper); text-align: left; cursor: pointer; font: 14px system-ui, sans-serif; }
    .nav-button:hover, .nav-button.active { border-color: var(--line); background: #f4e7c511; color: var(--gold); }
    #stage { min-width: 0; }
    .page-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; color: var(--gold); font-size: 24px; font-weight: 500; }
    h2 { color: var(--gold); font-size: 18px; font-weight: 500; }
    h3 { margin-bottom: 8px; color: #f1dfa9; font-size: 15px; font-weight: 500; }
    .muted { color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .game-card { display: grid; gap: 7px; min-height: 100px; padding: 15px; border: 1px solid var(--line); border-radius: 5px; background: #102d24aa; color: var(--paper); text-align: left; cursor: pointer; }
    .game-card:hover { border-color: var(--gold); background: #1b4536; }
    .game-card strong { color: var(--gold); font-size: 16px; font-weight: 500; }
    .game-card span { color: var(--muted); font: 12px/1.4 system-ui, sans-serif; }
    button, input, select { font: inherit; }
    button { color: var(--paper); cursor: pointer; }
    .action { min-height: 40px; padding: 8px 13px; border: 1px solid var(--gold); border-radius: 4px; background: #a62434; color: white; font: 700 13px system-ui, sans-serif; }
    .action.secondary { background: #183b2f; color: var(--gold); }
    .action:disabled { opacity: .45; cursor: not-allowed; }
    input, select { min-height: 40px; width: 100%; padding: 8px 10px; border: 1px solid #d6bf7b88; border-radius: 4px; background: #102a21; color: white; font: 16px system-ui, sans-serif; }
    label { display: grid; gap: 6px; color: #e0d6bd; font: 12px system-ui, sans-serif; }
    .form-row { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; }
    .form-row label { min-width: 150px; flex: 1; }
    .result { min-height: 25px; margin: 12px 0 0; color: #f1dfa9; font: 14px/1.5 system-ui, sans-serif; }
    .guess-bank { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .guess-bank table { width: 100%; border-collapse: collapse; font: 13px system-ui, sans-serif; }
    .guess-bank th, .guess-bank td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .guess-bank th { color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; }
    .guess-bank tr.latest { background: #dfc27718; color: #f5df9e; }
    .game-controls { max-width: 820px; }
    .option-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
    .choice { min-height: 38px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 4px; background: #142c24; }
    .choice:hover, .choice.selected { border-color: var(--gold); background: #244637; }
    .cards { display: flex; flex-wrap: wrap; gap: 9px; margin: 12px 0; }
    .playing-card { display: grid; place-content: center; width: 70px; height: 96px; border: 1px solid #d9d2c2; border-radius: 5px; background: #f4f0e6; color: #19221e; text-align: center; font: 700 14px/1.4 system-ui, sans-serif; }
    .playing-card.red-suit { color: #b92535; }
    .number-grid { display: grid; grid-template-columns: repeat(12, minmax(25px, 1fr)); gap: 4px; }
    .number-cell { min-height: 38px; border: 1px solid #d9c783; border-radius: 3px; background: var(--black); font: 700 13px Georgia, serif; }
    .number-cell.red { background: var(--red); }
    .number-cell.green { grid-column: 1 / -1; background: #167447; }
    .number-cell.selected { outline: 3px solid #ffe08a; outline-offset: 1px; }
    .number-cell.winner { position: relative; z-index: 2; outline: 3px solid #fff1af; outline-offset: 2px; box-shadow: 0 0 0 5px #fff1af66, 0 0 18px #fff1af; transform: scale(1.08); }
    .roulette-layout { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(350px, .95fr); gap: 24px; align-items: start; }
    .roulette-wheel { width: min(100%, 520px); height: auto; filter: drop-shadow(0 14px 20px #07171099); }
    .roulette-wheel #wheel-spin, .roulette-wheel #ball-spin { transform-box: view-box; transform-origin: 250px 250px; }
    .roulette-wheel .ball { fill: #04610a; stroke: #6b5b3d; stroke-width: 1; filter: drop-shadow(0 1px 3px #000); }
    .roulette-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 12px 0; }
    .roulette-options .choice { text-align: left; font: 13px system-ui, sans-serif; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 9px; }
    .field-card { padding: 5px; border: 1px solid var(--line); border-radius: 4px; background: #102d24; text-align: left; }
    .field-card img { display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 2px; }
    .field-card span { display: block; padding: 6px 2px 2px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .field-card:hover, .field-card.selected { border-color: var(--gold); }
    @keyframes field-shuffle-in { from { opacity: .25; transform: translateY(7px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .field-card.shuffle-in { animation: field-shuffle-in 360ms ease-out both; animation-delay: calc(var(--shuffle-index) * 12ms); }
    .letter-grid { display: grid; grid-template-columns: repeat(9, minmax(30px, 1fr)); gap: 5px; max-width: 540px; }
    .letter-grid button { min-height: 35px; border: 1px solid var(--line); border-radius: 3px; background: #183b2f; }
    .letter-grid button:disabled { opacity: .45; }
    .hangman-layout { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; align-items: center; }
    .hangman-drawing { display: block; width: 100%; max-width: 170px; height: auto; fill: none; stroke: #e4cd91; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .word-display { margin: 20px 0; color: var(--gold); font: 700 25px/1.6 system-ui, sans-serif; letter-spacing: 3px; }
    .error { color: #ffb5ad; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; padding: 14px; } aside { position: static; grid-template-columns: repeat(4, 1fr); } .nav-label { grid-column: 1 / -1; margin-top: 8px; } .nav-button { text-align: center; font-size: 12px; } .roulette-layout { grid-template-columns: 1fr; } .roulette-wheel { max-width: 430px; margin: auto; display: block; } }
    @media (max-width: 480px) {
      header { padding: 13px 15px; }
      .brand span { display: none; }
      aside { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-button, .action, .choice { min-height: 44px; }
      .form-row { align-items: stretch; }
      .form-row label { min-width: 100%; }
      .form-row > .action { width: 100%; }
      .number-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
      .number-cell { min-height: 42px; padding: 0 2px; font-size: 12px; }
      .letter-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
      .letter-grid button { min-height: 42px; }
      .hangman-layout { grid-template-columns: 1fr; gap: 8px; }
      .hangman-drawing { width: 130px; margin: auto; }
      .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game-card { min-height: 88px; padding: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>Game Center</strong><span>Table games & field finder</span></div>
    <div class="wallet"><label>Gambling balance</label><strong id="wallet">$50</strong><button id="save-terminal" type="button">Save</button><span id="save-status" role="status"></span></div>
  </header>
  <div class="layout">
    <aside aria-label="Game navigation">
      <div class="nav-label">Play</div>
      <button class="nav-button" data-view="guess">Number Guessing</button>
      <button class="nav-button" data-view="hangman">Hangman</button>
      <button class="nav-button" data-view="rps">Rock Paper Scissors</button>
      <button class="nav-button" data-view="dice">Dice Guessing</button>
      <div class="nav-label">More</div>
      <button class="nav-button" data-view="gambling">Gambling</button>
      <button class="nav-button" data-view="add-money">Add money</button>
      <button class="nav-button" data-view="finder">Field Finder</button>
      <button class="nav-button" data-view="exit">Exit</button>
    </aside>
    <main id="stage" tabindex="-1"></main>
  </div>
<script>
const redNumbers = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const wheelOrder = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const finderQuery = new URLSearchParams(location.search).get('finder');
const fieldIndex = Number(finderQuery ?? document.documentElement.dataset.finderIndex ?? 0);
const fieldCount = 21;
let balance = loadBalance();
let activeView = 'home';
let session = null;
let rouletteBet = 'red';
let rouletteNumber = null;
let rouletteBusy = false;
const stage = document.getElementById('stage');

function loadBalance() {
  try {
    const saved = localStorage.getItem('hellBalance');
    return saved === null ? 50 : Math.max(0, Number(saved) || 0);
  }
  catch { return 50; }
}
function saveBalance() {
  try { localStorage.setItem('hellBalance', String(balance)); } catch {}
  document.getElementById('wallet').textContent = '$' + balance.toLocaleString();
}
async function saveBalanceToTerminal() {
  saveBalance();
  const status = document.getElementById('save-status');
  const button = document.getElementById('save-terminal');
  button.disabled = true;
  try {
    const response = await fetch('/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({balance}),
    });
    if (!response.ok) throw new Error('Terminal save is unavailable.');
    status.textContent = `Saved $${balance.toLocaleString()} to the terminal.`;
  } catch {
    status.textContent = `Saved $${balance.toLocaleString()} on this device.`;
  } finally {
    button.disabled = false;
  }
}
function randomInt(max) { return Math.floor(Math.random() * max); }
function setStage(title, content) {
  activeView = title;
  document.querySelectorAll('.nav-button').forEach(button => button.classList.toggle('active', button.dataset.view === title));
  stage.innerHTML = `<div class="page-head"><h1>${title === 'home' ? 'Choose a game' : title}</h1></div>${content}`;
  stage.focus({preventScroll: true});
}
function home() {
  setStage('home', `<div class="game-grid">
    <button class="game-card" data-open="guess"><strong>Number Guessing</strong><span>Find the hidden number in ten tries.</span></button>
    <button class="game-card" data-open="hangman"><strong>Hangman</strong><span>Reveal the word one letter at a time.</span></button>
    <button class="game-card" data-open="rps"><strong>Rock Paper Scissors</strong><span>Play a quick round against the house.</span></button>
    <button class="game-card" data-open="dice"><strong>Dice Guessing</strong><span>Call the next roll from one to six.</span></button>
    <button class="game-card" data-open="math"><strong>Math Game</strong><span>Guess the missing number in an equation.</span></button>
    <button class="game-card" data-open="gambling"><strong>Gambling</strong><span>Play card, dice, and roulette tables.</span></button>
    <button class="game-card" data-open="finder"><strong>Field Finder</strong><span>Search 21 field scenes for the hidden person.</span></button>
    <button class="game-card" data-open="add-money"><strong>Add money</strong><span>Update your gambling balance.</span></button>
    <button class="game-card" data-open="exit"><strong>Exit</strong><span>Finish your session.</span></button>
  </div>`);
}
function errorText(id, text) { const target = document.getElementById(id); if (target) target.textContent = text; }
function wagerPanel() { return `<label>Wager amount<input id="wager" type="number" min="1" max="${balance}" step="1" value="${Math.min(10, balance)}"></label>`; }
function readWager() {
  const amount = Number(document.getElementById('wager')?.value);
  if (!Number.isInteger(amount) || amount < 1 || amount > balance) { errorText('result', 'Enter a whole-number wager within your balance.'); return null; }
  return amount;
}
function settle(net) { balance += net; saveBalance(); }
function startGuess(gambling = false) {
  session = {target: randomInt(100) + 1, attempts: 0, guesses: [], gambling, wager: null, done: false};
  drawGuess();
}
function makeMathQuestion() {
  const symbol = ['+', '-', '*', '/'][randomInt(4)];
  let number1, number2, answer;
  if (symbol === '/') {
    number2 = randomInt(12) + 1;
    answer = randomInt(12) + 1;
    number1 = number2 * answer;
  } else {
    number1 = randomInt(12) + 1;
    number2 = randomInt(12) + 1;
    if (symbol === '+') answer = number1 + number2;
    else if (symbol === '-') {
      if (number1 < number2) [number1, number2] = [number2, number1];
      answer = number1 - number2;
    } else answer = number1 * number2;
  }
  const hideFirst = randomInt(2) === 0;
  return {
    prompt: `${hideFirst ? '?' : number1} ${symbol} ${hideFirst ? number2 : '?'} = ${answer}`,
    correct: hideFirst ? number1 : number2,
  };
}
function startMathGame(score = 0, message = 'Guess the missing number.') {
  const question = makeMathQuestion();
  session = {...question, score, done: false};
  drawMathGame(message);
}
function drawMathGame(message) {
  const s = session;
  setStage('Math Game', `<div class="game-controls">
    <p class="muted">Correct answers: ${s.score}</p>
    <h2>${s.prompt}</h2>
    <div class="form-row"><label>Your answer<input id="math-guess" type="number" step="1" ${s.done ? 'disabled' : ''}></label><button class="action" id="math-submit" ${s.done ? 'disabled' : ''}>Check</button></div>
    <p class="result" id="result">${message}</p>
    ${s.done ? '<button class="action secondary" id="math-next">New question</button>' : ''}
  </div>`);
  const input = document.getElementById('math-guess');
  const submit = () => {
    const value = input.value.trim();
    if (value === '' || !Number.isInteger(Number(value))) {
      errorText('result', 'Enter a whole number.');
      return;
    }
    const guess = Number(value);
    if (guess === s.correct) {
      s.score++;
      s.done = true;
      settle(50);
      drawMathGame('Correct! You found the missing number and earned $50.');
    } else {
      errorText('result', 'Not quite. Try another number.');
      input.select();
    }
  };
  document.getElementById('math-submit')?.addEventListener('click', submit);
  input?.addEventListener('keydown', event => {
    if (event.key === 'Enter') submit();
  });
  document.getElementById('math-next')?.addEventListener('click', () => startMathGame(s.score));
}
function guessHistoryMarkup(guesses) {
  if (guesses.length === 0) return '<tr><td colspan="3" class="muted">No guesses yet.</td></tr>';
  return guesses.map((guess, index) => `<tr class="${index === guesses.length - 1 ? 'latest' : ''}"><td>${index + 1}</td><td>${guess.value}</td><td>${guess.result}</td></tr>`).join('');
}
function drawGuess(message = 'Enter a number from 1 to 100.') {
  const s = session;
  setStage(s.gambling ? 'Gambling · Number Guessing' : 'Number Guessing', `<div class="game-controls">
    <p class="muted">${s.attempts} of 10 guesses used.</p>
    <div class="form-row">${s.gambling && s.wager === null ? wagerPanel() : ''}<label>Your guess<input id="guess-value" type="number" min="1" max="100" ${s.done ? 'disabled' : ''}></label><button class="action" id="guess-submit" ${s.done ? 'disabled' : ''}>Guess</button></div>
    <p class="result" id="result">${message}</p>${s.done ? '<button class="action secondary" data-restart="guess">Play again</button>' : ''}
    <section class="guess-bank" aria-label="Guess history"><h2>Guess history</h2><table><thead><tr><th>Try</th><th>Guess</th><th>Relation</th></tr></thead><tbody>${guessHistoryMarkup(s.guesses)}</tbody></table></section></div>`);
  document.getElementById('guess-submit')?.addEventListener('click', () => {
    const input = document.getElementById('guess-value'); const value = Number(input.value);
    if (!Number.isInteger(value) || value < 1 || value > 100) { errorText('result', 'Choose a whole number from 1 to 100.'); return; }
    if (s.gambling && s.wager === null) { s.wager = readWager(); if (s.wager === null) return; }
    s.attempts++;
    const relation = value === s.target ? 'Correct' : value < s.target ? 'Too low' : 'Too high';
    s.guesses.push({value, result: relation});
    if (value === s.target) { if (s.gambling) settle(s.wager); s.done = true; drawGuess(`Correct. The number was ${s.target}.${s.gambling ? ` You won $${s.wager}.` : ''}`); }
    else if (s.attempts >= 10) { if (s.gambling) settle(-s.wager); s.done = true; drawGuess(`Out of guesses. The number was ${s.target}.${s.gambling ? ` You lost $${s.wager}.` : ''}`); }
    else drawGuess(`${value < s.target ? 'Too low' : 'Too high'}. ${10 - s.attempts} guesses left.`);
  });
  document.getElementById('guess-value')?.addEventListener('keydown', event => { if (event.key === 'Enter') document.getElementById('guess-submit').click(); });
}
const wordList = ['python','computer','hangman','student','programming','keyboard','library','science','coffee','planet','rocket','garden','forest','ocean','mountain','pencil','notebook','rainbow','bicycle','universe','language','adventure','backpack','journey','picture','machine','browser','database','learning','festival','camera','castle','butterfly','puzzle','village','harbor','bridge','concert','guitar','piano','victory','orange','banana','strawberry','tomato','sandwich'];
function startHangman(gambling = false) { session = {word: wordList[randomInt(wordList.length)], letters: [], wrong: 0, gambling, wager: null, done: false}; drawHangman(); }
function hangmanDrawing(wrong) {
  const reveal = (mistake, markup) => wrong >= mistake ? markup : '';
  return `<svg class="hangman-drawing" viewBox="0 0 180 155" role="img" aria-label="Hangman, ${wrong} of 6 mistakes">
    <path d="M20 142 H160 M52 142 V12 H118 V24"/>
    ${reveal(1, '<circle cx="118" cy="39" r="15"/>')}
    ${reveal(2, '<path d="M118 54 V94"/>')}
    ${reveal(3, '<path d="M118 65 L94 82"/>')}
    ${reveal(4, '<path d="M118 65 L142 82"/>')}
    ${reveal(5, '<path d="M118 94 L96 122"/>')}
    ${reveal(6, '<path d="M118 94 L140 122"/>')}
  </svg>`;
}
function drawHangman(message = '') {
  const s = session;
  const display = [...s.word].map(letter => s.letters.includes(letter) ? letter : '_').join(' ');
  const keyboard = 'abcdefghijklmnopqrstuvwxyz'.split('').map(letter => `<button data-letter="${letter}" ${s.letters.includes(letter) || s.done ? 'disabled' : ''}>${letter.toUpperCase()}</button>`).join('');
  setStage(s.gambling ? 'Gambling · Hangman' : 'Hangman', `<div class="game-controls">${s.gambling && s.wager === null ? `<div class="form-row">${wagerPanel()}</div>` : ''}<div class="hangman-layout">${hangmanDrawing(s.wrong)}<div><p class="muted">Mistakes: ${s.wrong} / 6</p><div class="word-display">${display}</div><p class="muted">Guessed: ${s.letters.join(', ') || 'None'}</p><div class="letter-grid">${keyboard}</div><p class="result" id="result">${message}</p>${s.done ? '<button class="action secondary" data-restart="hangman">Play again</button>' : ''}</div></div></div>`);
  stage.querySelectorAll('[data-letter]').forEach(button => button.addEventListener('click', () => {
    if (s.gambling && s.wager === null) { s.wager = readWager(); if (s.wager === null) return; }
    const letter = button.dataset.letter; s.letters.push(letter);
    if (!s.word.includes(letter)) s.wrong++;
    const won = [...new Set(s.word)].every(item => s.letters.includes(item));
    if (won) { s.done = true; if (s.gambling) settle(s.wager); drawHangman(`You found ${s.word}.${s.gambling ? ` You won $${s.wager}.` : ''}`); }
    else if (s.wrong >= 6) { s.done = true; if (s.gambling) settle(-s.wager); drawHangman(`The word was ${s.word}.${s.gambling ? ` You lost $${s.wager}.` : ''}`); }
    else drawHangman();
  }));
}
function startRps(gambling = false) {
  session = {gambling, wager:null, score:[0,0], done:false};
  drawRps();
}
function drawRps(message = 'Choose your move.') {
  const s = session;
  setStage(s.gambling ? 'Gambling · Rock Paper Scissors' : 'Rock Paper Scissors', `<div class="game-controls">${s.gambling && s.wager === null ? `<div class="form-row">${wagerPanel()}</div>` : ''}<p class="muted">You ${s.score[0]} — House ${s.score[1]}</p><div class="option-row">${['rock','paper','scissors'].map(choice => `<button class="choice" data-rps="${choice}" ${s.gambling && s.done ? 'disabled' : ''}>${choice[0].toUpperCase()+choice.slice(1)}</button>`).join('')}</div><p class="result" id="result">${message}</p>${s.gambling && s.done ? '<button class="action secondary" data-open="gambling">Back to gambling</button>' : ''}</div>`);
  stage.querySelectorAll('[data-rps]').forEach(button => button.addEventListener('click', () => {
    if (s.gambling && s.wager === null) { s.wager = readWager(); if (s.wager === null) return; }
    const yours = button.dataset.rps; const house = ['rock','paper','scissors'][randomInt(3)];
    const won = (yours === 'rock' && house === 'scissors') || (yours === 'paper' && house === 'rock') || (yours === 'scissors' && house === 'paper');
    const tied = yours === house;
    if (won) { s.score[0]++; if (s.gambling) settle(s.wager); }
    else if (!tied) { s.score[1]++; if (s.gambling) settle(-s.wager); }
    if (s.gambling) s.done = true;
    drawRps(`You chose ${yours}; house chose ${house}. ${tied ? 'Tie.' : won ? `You win${s.gambling ? ` $${s.wager}` : ''}.` : `House wins${s.gambling ? `; you lose $${s.wager}` : ''}.`}`);
  }));
}
function startDice(gambling = false) {
  setStage(gambling ? 'Gambling · Dice Guessing' : 'Dice Guessing', `<div class="game-controls"><div class="form-row">${gambling ? wagerPanel() : ''}<label>Guess (1–6)<input id="dice-guess" type="number" min="1" max="6" step="1" value="3"></label><button class="action" id="dice-roll">Roll</button></div><p class="result" id="result">Call the roll.</p></div>`);
  document.getElementById('dice-roll').addEventListener('click', () => {
    const guess = Number(document.getElementById('dice-guess').value);
    if (!Number.isInteger(guess) || guess < 1 || guess > 6) { errorText('result', 'Choose a whole number from 1 to 6.'); return; }
    const bet = gambling ? readWager() : 0; if (gambling && bet === null) return;
    const roll = randomInt(6) + 1, won = guess === roll;
    if (gambling) settle(won ? bet : -bet);
    errorText('result', `The die rolled ${roll}. ${won ? `Correct${gambling ? `, you won $${bet}` : ''}.` : `Not this time${gambling ? `, you lost $${bet}` : ''}.`}`);
  });
}
function addMoneyPage() {
  setStage('Add money', `<div class="game-controls"><p class="muted">Your balance is $${balance.toLocaleString()}.</p><div class="form-row"><label>Starting balance<input id="base-balance" value="${balance}" inputmode="decimal"></label><label>Amount to add<input id="add-amount" value="500" inputmode="decimal"></label><button class="action" id="add-money">Update balance</button></div><p class="result" id="result"></p></div>`);
  document.getElementById('add-money').addEventListener('click', () => {
    try { const base = parseMoney(document.getElementById('base-balance').value); const addition = parseMoney(document.getElementById('add-amount').value); balance = base + addition; saveBalance(); errorText('result', `Balance updated to $${balance.toLocaleString()}.`); }
    catch { errorText('result', 'Enter valid amounts such as 500, 1k, or 2.5m.'); }
  });
}
function parseMoney(value) {
  const input = String(value).trim().toLowerCase().replaceAll('$','');
  const suffix = input.slice(-1), scale = {k:1e3,m:1e6,b:1e9}[suffix] || 1;
  const numeric = scale === 1 ? input : input.slice(0,-1);
  const valueNumber = Number(numeric) * scale;
  if (!numeric || !Number.isSafeInteger(valueNumber) || valueNumber < 0) throw new Error('invalid amount');
  return valueNumber;
}
function gamblingMenu() {
  const casino = [['dice','Dice Guessing'],['poker','Poker'],['blackjack','Blackjack'],['guess','Number Guessing'],['hangman','Hangman'],['rps','Rock Paper Scissors'],['roulette','Roulette']];
  setStage('Gambling', `<p class="muted">Balance: $${balance.toLocaleString()}</p><div class="game-grid">${casino.map(([key,label]) => `<button class="game-card" data-casino="${key}"><strong>${label}</strong><span>Play for a wager</span></button>`).join('')}<button class="game-card" data-open="add-money"><strong>Add money</strong><span>Update your gambling balance.</span></button><button class="game-card" data-open="home"><strong>Leave gambling</strong><span>Return to the game center.</span></button></div>`);

}
function launchCasino(game) {
  if (game === 'dice') startDice(true);
  else if (game === 'guess') startGuess(true);
  else if (game === 'hangman') startHangman(true);
  else if (game === 'rps') startRps(true);
  else if (game === 'roulette') roulettePage();
  else if (game === 'poker') pokerPage();
  else if (game === 'blackjack') blackjackPage();
}
function shuffleFieldOrder(previousOrder, hiddenSource) {
  const order = Array.from({length:fieldCount}, (_, index) => index);
  for (let index = order.length - 1; index > 0; index--) {
    const swapIndex = randomInt(index + 1);
    [order[index], order[swapIndex]] = [order[swapIndex], order[index]];
  }
  if (order.indexOf(hiddenSource) === previousOrder.indexOf(hiddenSource)) {
    const targetPosition = order.indexOf(hiddenSource);
    const otherPosition = (targetPosition + 1) % order.length;
    [order[targetPosition], order[otherPosition]] = [order[otherPosition], order[targetPosition]];
  }
  return order;
}
function finderPage(fieldOrder = Array.from({length:fieldCount}, (_, index) => index), hiddenSource = fieldIndex >= 0 && fieldIndex < fieldCount ? fieldIndex : randomInt(fieldCount), shuffled = false) {
  session = {target:fieldOrder.indexOf(hiddenSource), hiddenSource, fieldOrder, attempts:0, done:false};
  const cards = Array.from({length:fieldCount}, (_,index) => {
    const sourcePosition = (fieldOrder[index] / 2).toFixed(1).replace('.','_');
    const fieldPosition = (index / 2).toFixed(1);
    return `<button class="field-card ${shuffled ? 'shuffle-in' : ''}" style="--shuffle-index:${index}" data-field="${index}"><img src="../fields/field_${sourcePosition}.svg" alt="Field ${fieldPosition} scene"><span>Field ${fieldPosition}</span></button>`;
  }).join('');
  setStage('Field Finder', `<p class="muted">Find the hidden person among 21 fields.</p><div class="field-grid">${cards}</div><p class="result" id="result">Choose a field.</p>`);
  stage.querySelectorAll('[data-field]').forEach(button => button.addEventListener('click', () => {
    if (session.done) return;
    session.attempts++;
    if (Number(button.dataset.field) === session.target) {
      session.done = true;
      const completedRound = session;
      errorText('result', `Found in field ${(session.target/2).toFixed(1)} after ${session.attempts} guesses. Shuffling fields...`);
      setTimeout(() => finderPage(shuffleFieldOrder(completedRound.fieldOrder, completedRound.hiddenSource), completedRound.hiddenSource, true), 1000);
    }
    else { button.disabled = true; button.classList.add('selected'); errorText('result', `Not there. ${fieldCount - session.attempts} fields remain.`); }
  }));
}
function roulettePage() {
  rouletteBet = 'red'; rouletteNumber = null; rouletteBusy = false;
  const cells = `<button class="number-cell green" data-number="0">0</button>` + Array.from({length:36},(_,i) => { const n=i+1; return `<button class="number-cell ${redNumbers.has(n)?'red':''}" data-number="${n}">${n}</button>`; }).join('');
  setStage('Gambling · Roulette', `<div class="roulette-layout"><section><svg class="roulette-wheel" viewBox="0 0 500 500" aria-label="Roulette wheel"><circle cx="250" cy="250" r="235" fill="#171817" stroke="#b08a4c" stroke-width="10"/><g id="wheel-spin"><circle cx="250" cy="250" r="220" fill="#302619" stroke="#e1c477" stroke-width="4"/><g id="pockets"></g><circle cx="250" cy="250" r="188" fill="none" stroke="#f0d58b" stroke-width="4"/><circle cx="250" cy="250" r="145" fill="#bd9852" stroke="#f0d58b" stroke-width="4"/><circle cx="250" cy="250" r="75" fill="#17241e" stroke="#e0c276" stroke-width="3"/><text x="250" y="246" class="wheel-title">EUROPEAN</text><text x="250" y="270" class="wheel-subtitle">SINGLE ZERO</text></g><g id="ball-spin"><circle class="ball" cx="250" cy="73" r="6"/></g><path class="pointer" d="M250 12 L239 38 L261 38 Z"/></svg><p class="result" id="roulette-result">Choose a bet and spin.</p></section><section><h2>Betting table</h2><p class="muted">Select a number or outside bet.</p><div class="number-grid" id="roulette-numbers">${cells}</div><div class="roulette-options">${[['red','Red'],['black','Black'],['even','Even'],['odd','Odd'],['low','Low · 1–18'],['high','High · 19–36']].map(([key,label])=>`<button class="choice" data-roulette-bet="${key}">${label}</button>`).join('')}</div><div class="form-row"><label>Wager amount<input id="roulette-wager" type="number" min="1" max="${balance}" value="${Math.min(10,balance)}"></label><button id="roulette-spin" class="action">Spin</button></div></section></div>`);
  const svgNS = 'http://www.w3.org/2000/svg';
  const pockets = document.getElementById('pockets');
  wheelOrder.forEach((number, index) => {
    const start = -Math.PI / 2 + index * Math.PI * 2 / 37 + .004;
    const end = -Math.PI / 2 + (index + 1) * Math.PI * 2 / 37 - .004;
    const point = (radius, angle) => [250 + radius * Math.cos(angle), 250 + radius * Math.sin(angle)];
    const outerStart = point(184, start), outerEnd = point(184, end);
    const innerEnd = point(145, end), innerStart = point(145, start);
    const middle = (start + end) / 2, labelPoint = point(164, middle);
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${outerStart[0]} ${outerStart[1]} A184 184 0 0 1 ${outerEnd[0]} ${outerEnd[1]} L${innerEnd[0]} ${innerEnd[1]} A145 145 0 0 0 ${innerStart[0]} ${innerStart[1]} Z`);
    path.setAttribute('fill', number === 0 ? '#167447' : redNumbers.has(number) ? '#e32232' : '#111213');
    path.setAttribute('stroke', '#dfc277');
    path.setAttribute('stroke-width', '1');
    pockets.append(path);
    const label = document.createElementNS(svgNS, 'text');
    label.textContent = number;
    label.setAttribute('x', labelPoint[0]);
    label.setAttribute('y', labelPoint[1]);
    label.setAttribute('fill', '#fff8e8');
    label.setAttribute('font-size', '14');
    label.setAttribute('font-family', 'Georgia,serif');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'middle');
    label.setAttribute('transform', `rotate(${middle * 180 / Math.PI + 90} ${labelPoint[0]} ${labelPoint[1]})`);
    pockets.append(label);
  });
  document.querySelectorAll('[data-roulette-bet]').forEach(button => button.addEventListener('click', () => {
    rouletteBet = button.dataset.rouletteBet;
    rouletteNumber = null;
    updateRouletteSelection();
  }));
  document.querySelectorAll('[data-number]').forEach(button => button.addEventListener('click', () => {
    rouletteBet = 'number';
    rouletteNumber = Number(button.dataset.number);
    updateRouletteSelection();
  }));
  updateRouletteSelection();
  document.getElementById('roulette-spin').addEventListener('click', spinRoulette);
}
function updateRouletteSelection() {
  document.querySelectorAll('[data-roulette-bet]').forEach(button => button.classList.toggle('selected', button.dataset.rouletteBet === rouletteBet));
  document.querySelectorAll('[data-number]').forEach(button => button.classList.toggle('selected', rouletteBet === 'number' && Number(button.dataset.number) === rouletteNumber));
  const spin = document.getElementById('roulette-spin');
  if (spin) spin.disabled = rouletteBusy || balance < 1 || (rouletteBet === 'number' && rouletteNumber === null);
}
async function spinRoulette() {
  const wager = Number(document.getElementById('roulette-wager').value);
  if (!Number.isInteger(wager) || wager < 1 || wager > balance) { errorText('roulette-result', 'Enter a whole-number wager within your balance.'); return; }
  rouletteBusy = true;
  updateRouletteSelection();
  const number = randomInt(37);
  const index = wheelOrder.indexOf(number);
  const wheelDegrees = 360 * 8 - (index + 0.5) * 360 / 37;
  const wheel = document.getElementById('wheel-spin'), ball = document.getElementById('ball-spin');
  const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 6000;
  const animationOptions = {duration, easing: 'cubic-bezier(.12,.78,.18,1)', fill: 'forwards'};
  const spins = [
    wheel.animate([{transform: 'rotate(0deg)'}, {transform: `rotate(${wheelDegrees}deg)`}], animationOptions),
    ball.animate([{transform: 'rotate(0deg)'}, {transform: 'rotate(-2880deg)'}], animationOptions),
  ];
  await Promise.all(spins.map(animation => animation.finished));
  const color = number === 0 ? 'green' : redNumbers.has(number) ? 'red' : 'black';
  const won = (rouletteBet === 'number' && rouletteNumber === number) || rouletteBet === color ||
    (rouletteBet === 'even' && number !== 0 && number % 2 === 0) ||
    (rouletteBet === 'odd' && number % 2 === 1) ||
    (rouletteBet === 'low' && number >= 1 && number <= 18) ||
    (rouletteBet === 'high' && number >= 19 && number <= 36);
  const payout = won ? (rouletteBet === 'number' ? wager * 35 : wager) : 0;
  settle(won ? payout : -wager);
  document.querySelectorAll('[data-number]').forEach(button => button.classList.toggle('winner', Number(button.dataset.number) === number));
  const detail = number === 0 ? 'Zero' : `${number % 2 === 0 ? 'Even' : 'Odd'}, ${number <= 18 ? 'Low' : 'High'}`;
  errorText('roulette-result', `${number} · ${color.toUpperCase()} · ${detail}. ${won ? `You won $${payout.toLocaleString()}.` : `You lost $${wager.toLocaleString()}.`}`);
  rouletteBusy = false;
  updateRouletteSelection();
}
function createDeck() {
  const deck = [];
  for (const suit of ['Hearts', 'Diamonds', 'Clubs', 'Spades']) for (let value = 2; value <= 14; value++) deck.push({suit, value});
  for (let index = deck.length - 1; index > 0; index--) { const swap = randomInt(index + 1); [deck[index], deck[swap]] = [deck[swap], deck[index]]; }
  return deck;
}
function cardLabel(card) {
  const value = ({11:'J',12:'Q',13:'K',14:'A'})[card.value] || card.value;
  const suit = ({Hearts:'♥',Diamonds:'♦',Clubs:'♣',Spades:'♠'})[card.suit];
  return `<div class="playing-card ${card.suit === 'Hearts' || card.suit === 'Diamonds' ? 'red-suit' : ''}">${value}<br>${suit}</div>`;
}
function handValue(hand) {
  let total = 0, aces = 0;
  for (const card of hand) { if (card.value === 14) { total += 11; aces++; } else total += Math.min(card.value, 10); }
  while (total > 21 && aces > 0) { total -= 10; aces--; }
  return total;
}
function blackjackPage() {
  session = {wager: null, deck: [], player: [], dealer: [], done: false};
  setStage('Gambling · Blackjack', `<div class="game-controls"><div class="form-row">${wagerPanel()}<button class="action" id="deal-blackjack">Deal</button></div><p class="result" id="result">Place your wager and deal.</p></div>`);
  document.getElementById('deal-blackjack').addEventListener('click', () => {
    const wager = readWager(); if (wager === null) return;
    session.wager = wager; session.deck = createDeck();
    session.player = [session.deck.pop(), session.deck.pop()]; session.dealer = [session.deck.pop(), session.deck.pop()];
    if (handValue(session.player) === 21) finishBlackjack(1, 'You hit 21.');
    else drawBlackjack();
  });
}
function finishBlackjack(outcome, message) {
  if (outcome !== 0) settle(outcome > 0 ? session.wager : -session.wager);
  session.done = true;
  session.message = `${message} Player ${handValue(session.player)}, dealer ${handValue(session.dealer)}.${outcome > 0 ? ` You won $${session.wager}.` : outcome < 0 ? ` You lost $${session.wager}.` : ' Push.'}`;
  drawBlackjack();
}
function drawBlackjack() {
  const s = session;
  setStage('Gambling · Blackjack', `<div class="game-controls"><p class="muted">Dealer · ${s.dealer.length ? handValue(s.dealer) : ''}</p><div class="cards">${s.dealer.map(cardLabel).join('')}</div><p class="muted">Player · ${s.player.length ? handValue(s.player) : ''}</p><div class="cards">${s.player.map(cardLabel).join('')}</div><p class="result" id="result">${s.message || ''}</p>${s.done ? '<button class="action secondary" data-open="gambling">Back to gambling</button>' : '<div class="option-row"><button class="action" id="hit">Hit</button><button class="action secondary" id="stand">Stand</button></div>'}</div>`);
  if (s.done) return;
  document.getElementById('hit').addEventListener('click', () => {
    s.player.push(s.deck.pop());
    if (handValue(s.player) > 21) finishBlackjack(-1, 'You busted.'); else drawBlackjack();
  });
  document.getElementById('stand').addEventListener('click', () => {
    while (handValue(s.dealer) < 17) s.dealer.push(s.deck.pop());
    const player = handValue(s.player), dealer = handValue(s.dealer);
    finishBlackjack(dealer > 21 || player > dealer ? 1 : player < dealer ? -1 : 0, dealer > 21 ? 'Dealer busted.' : 'Hand complete.');
  });
}
function pokerScore(hand) {
  const values = hand.map(card => card.value).sort((a,b) => b-a);
  const counts = new Map();
  values.forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
  const groups = [...counts.entries()].sort((a,b) => b[1]-a[1] || b[0]-a[0]);
  const flush = hand.every(card => card.suit === hand[0].suit);
  const unique = [...new Set(values)].sort((a,b) => b-a);
  let straightHigh = 0;
  if (unique.length === 5 && unique[0] - unique[4] === 4) straightHigh = unique[0];
  else if (unique.join(',') === '14,5,4,3,2') straightHigh = 5;
  if (flush && straightHigh) return [8, straightHigh];
  if (groups[0][1] === 4) return [7, groups[0][0], groups[1][0]];
  if (groups[0][1] === 3 && groups[1][1] === 2) return [6, groups[0][0], groups[1][0]];
  if (flush) return [5, ...values];
  if (straightHigh) return [4, straightHigh];
  if (groups[0][1] === 3) return [3, groups[0][0], ...groups.slice(1).map(group => group[0]).sort((a,b)=>b-a)];
  if (groups[0][1] === 2 && groups[1][1] === 2) return [2, Math.max(groups[0][0],groups[1][0]), Math.min(groups[0][0],groups[1][0]), groups[2][0]];
  if (groups[0][1] === 2) return [1, groups[0][0], ...groups.slice(1).map(group => group[0]).sort((a,b)=>b-a)];
  return [0, ...values];
}
function pokerRankName(rank) { return ['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'][rank]; }
function compareScores(first, second) {
  for (let index=0; index<Math.max(first.length,second.length); index++) { const difference=(first[index]||0)-(second[index]||0); if (difference) return difference; }
  return 0;
}
function pokerPage() {
  setStage('Gambling · Poker', `<div class="game-controls"><div class="form-row">${wagerPanel()}<button class="action" id="deal-poker">Deal hands</button></div><div id="poker-hands"></div><p class="result" id="result">Five cards each. Best hand wins.</p></div>`);
  document.getElementById('deal-poker').addEventListener('click', () => {
    const wager=readWager();if(wager===null)return;
    const deck=createDeck(), player=Array.from({length:5},()=>deck.pop()), dealer=Array.from({length:5},()=>deck.pop());
    const playerScore=pokerScore(player), dealerScore=pokerScore(dealer), comparison=compareScores(playerScore,dealerScore);
    if(comparison>0)settle(wager);else if(comparison<0)settle(-wager);
    document.getElementById('poker-hands').innerHTML=`<h3>Your hand · ${pokerRankName(playerScore[0])}</h3><div class="cards">${player.map(cardLabel).join('')}</div><h3>House hand · ${pokerRankName(dealerScore[0])}</h3><div class="cards">${dealer.map(cardLabel).join('')}</div>`;
    errorText('result',comparison>0?`You win $${wager}.`:comparison<0?`House wins; you lose $${wager}.`:'Tie. Your wager is returned.');
  });
}

function exitPage() {

  fetch('/finish', {method: 'POST'}).catch(() => {});

  else if (view === 'hangman') startHangman();
  else if (view === 'rps') startRps();

home();saveBalance();
